<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1115" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Training Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app shell — header, scrolling content, rest timer + tab bar pinned to the bottom. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e4e8ed; --ink:#14181d; --muted:#5b6672; --line:#d4dae2;
  --accent:#1f5bd8; --accent-ink:#ffffff; --accent-soft:#dfe8fb;
  --done:#1d7f47; --done-bg:#e1f2e8; --warn:#b4410f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1115; --surface:#171c22; --sunk:#11151a; --ink:#e7ecf1; --muted:#8e9aa8; --line:#28303a;
  --accent:#6693ff; --accent-ink:#0a1020; --accent-soft:#1c2a4a;
  --done:#43cf7f; --done-bg:#15291e; --warn:#ff8a4c; --swapbg:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#171c22; --sunk:#11151a; --ink:#e7ecf1; --muted:#8e9aa8; --line:#28303a;
  --accent:#6693ff; --accent-ink:#0a1020; --accent-soft:#1c2a4a;
  --done:#43cf7f; --done-bg:#15291e; --warn:#ff8a4c; --swapbg:#000; color-scheme:dark}

/* Plan colours (Christian 2026-11-03): Strength blue (default), Cardio orange, Balance pink – celebrations follow the plan colour */
:root[data-accent="orange"]{--accent:#c2410c;--accent-ink:#ffffff;--accent-soft:#fde4d6}
:root[data-accent="pink"]{--accent:#c2187a;--accent-ink:#ffffff;--accent-soft:#fbe0ee}
@media (prefers-color-scheme: dark){
  :root[data-accent="orange"]:not([data-theme="light"]){--accent:#ff8a4c;--accent-ink:#1a0c04;--accent-soft:#3d2418}
  :root[data-accent="pink"]:not([data-theme="light"]){--accent:#ff4fa3;--accent-ink:#1a0610;--accent-soft:#3d1a2e}}
:root[data-theme="dark"][data-accent="orange"]{--accent:#ff8a4c;--accent-ink:#1a0c04;--accent-soft:#3d2418}
:root[data-theme="dark"][data-accent="pink"]{--accent:#ff4fa3;--accent-ink:#1a0610;--accent-soft:#3d1a2e}
.colcard{display:grid;gap:10px;margin:14px 0}.colrow{display:flex;flex-wrap:wrap;gap:8px}
.colchip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.colchip i{width:14px;height:14px;border-radius:50%;flex:none}.colchip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:conf 2.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes conf{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding:0 16px;padding-block:0 180px;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

header.top{padding-block:18px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;line-height:1.1}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sec{margin:24px 0 10px}

/* week card */
.weekcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.weeknav{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}
.weeknav .wt{font-family:var(--display);font-size:20px;font-weight:700}
.weeknav .wt small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.navbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;display:grid;place-items:center}
.navbtn:disabled{opacity:.35;cursor:default}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow.sel{background:var(--accent-soft)}
.check{width:30px;height:30px;flex:none;border-radius:9px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;color:transparent;font-weight:700}
.check.on{background:var(--done);border-color:var(--done);color:var(--accent-ink)}
.wbtn{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0}
.wbtn b{display:block;font-weight:600}
.wbtn small{display:block;font-size:13px;color:var(--muted)}
.wrow .go{color:var(--muted)}

/* session */
.sess{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.meter{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-bottom:14px}
.meter span{display:block;height:100%;background:var(--done);transition:width .25s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--done-bg);color:var(--done)}
.note{font-size:14px;color:var(--ink);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:14px}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ex.complete{border-color:var(--done)}
.ex.ss1{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.ex.ss2{border-top-left-radius:0;border-top-right-radius:0;border-top-style:dashed}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exname{font-weight:600;font-size:17px;min-width:0}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.target{font-family:var(--display);font-size:20px;font-weight:600;white-space:nowrap}
.cue{font-size:13px;color:var(--muted);margin-top:2px}
.last{font-size:13px;color:var(--muted);margin-top:2px}
.last .up{color:var(--done);font-weight:600}
.exbody{display:flex;gap:10px;align-items:flex-end;margin-top:12px}
.setcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lastlbl{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lastlbl .up{color:var(--done);text-transform:none;letter-spacing:0;font-size:13px;margin-left:auto}.lastlbl .up.down{color:var(--accent)}
.lastrow,.sets{display:grid;gap:8px}
.lastrow{font-size:13px;color:var(--muted);text-align:center}
.lastrow.tight{font-size:12px}
.libsearch{margin:0 0 6px}
.obmode .bottom{display:none}
.ob{display:grid;gap:14px;padding-bottom:30px}
.ob header.top{align-items:flex-start}
.obp{margin:0;color:var(--muted)}
.obsmall{font-size:13px;margin:0;text-align:center}
.obsteps{list-style:none;margin:6px 0;padding:0;display:grid;gap:10px;counter-reset:s}
.obsteps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 52px;position:relative;display:grid}
.obsteps li::before{content:counter(s);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.obsteps span{font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:10px}
.infobtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-family:Georgia,serif;font-size:18px;flex:none}
.infobtn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.obrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.obrow.col{flex-direction:column;align-items:stretch}
.oblbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.oblbl .muted{text-transform:none;letter-spacing:0;font-weight:500}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg .obchip{border:0;border-radius:0;min-height:40px}
.obchips{display:flex;flex-wrap:wrap;gap:8px}.obchips.static .pill{font-size:13px}
.obchip{min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px}
.obchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.obchip:disabled{opacity:.4}
.obchip.big{border-radius:12px;min-height:52px}
.obgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.obgrid2.tight{gap:8px}
.inu{display:flex;align-items:center;gap:6px}.inu i{font-style:normal;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.inu2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.obwarn{background:var(--warn);color:#fff;border-radius:10px;padding:10px 12px;font-size:14px;margin:0}
.obmore{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;min-height:48px;color:var(--ink)}
.obmore[aria-expanded="true"] .chev{transform:rotate(90deg)}
.obcards{display:grid;gap:10px}
.obcard{display:grid;gap:4px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;color:var(--ink)}
.obcard b{font-family:var(--display);font-size:22px}.obcard span{color:var(--muted);font-size:14px}
.obcard[aria-pressed="true"]{border:2px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.obshape{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.obcard.sh{justify-items:center;text-align:center;color:var(--muted);min-height:130px;align-content:center}
.obcard.sh[aria-pressed="true"]{color:var(--accent)}
.obdir{display:grid;gap:4px}.obdir h2{margin:2px 0}.obdir p{margin:0}
.obnone{display:grid;gap:2px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;min-height:56px;color:var(--ink)}
.obnone span{font-size:13px;color:var(--muted)}
.obnone[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.obnone[aria-pressed="true"] span{color:var(--accent-ink)}
.obanchor{background:var(--accent-soft);border-radius:12px;padding:12px;display:grid;gap:8px}.obanchor p{margin:0;font-size:14px}
.obfit{border:1.5px solid var(--accent);background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:10px}.obfit p{margin:0}
.obweek{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}.obweek li{display:grid}.obweek span{font-size:14px;color:var(--muted)}
.obnav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}.obnav .btn{min-height:48px;flex:1}
.btn:disabled{opacity:.45}
.obsum{display:flex;align-items:center;gap:10px;margin-bottom:14px}.obsum>div{flex:1;min-width:0}.obsum small{display:block;color:var(--muted);font-size:13px}
.libgrp{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700;margin:22px 0 8px}
.libitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.librow{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:12px 14px;text-align:left;min-height:52px}
.librow .lt{flex:1;min-width:0}.librow b{display:block;font-weight:600}.librow small{display:block;font-size:13px;color:var(--muted)}
.libitem.open .librow .chev{transform:rotate(90deg)}
.libcard{padding:0 14px 14px;display:grid;gap:10px}
.guide .libcard,.ex .libcard{padding:10px 0 0}
.libchips{display:flex;flex-wrap:wrap;gap:6px}
.libchip{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;min-height:36px;color:var(--ink)}
.libchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.libguide{margin-top:0;border-top:0;padding-top:0}
.feelit{font-size:13px;color:var(--accent);margin-top:2px}
.feelit b{font-weight:600}
.setbox{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.setbox.done{border:2px solid var(--done)}
.findnote{font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:6px 10px;margin:8px 0 0}.newtag{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;vertical-align:middle}.findban b{font-weight:700}
.setbox.cd{border:2px solid #d9611a}.setbox.cd .setmain{background:#d9611a;color:#fff}.setbox.cd .setmain small,.setbox.cd .of{color:#fff}
.arr{height:26px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.arr.up{border-bottom:1px solid var(--line)}
.arr.dn{border-top:1px solid var(--line)}
.setbox.done .arr{border-color:color-mix(in srgb,var(--done) 35%,transparent)}
.setmain{min-height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1;padding:0}
.setmain .rp{display:flex;align-items:baseline;gap:1px}
.setmain b{font-family:var(--display);font-size:24px}
.setmain .of{font-family:var(--display);font-size:15px;opacity:.75}
.setmain small{font-size:11px;color:var(--muted)}
.setbox.done .setmain{background:var(--done);color:var(--accent-ink)}
.setbox.done .setmain small{color:var(--accent-ink);opacity:.85}
.feel{display:flex;flex-direction:column;gap:10px;padding-left:10px;border-left:1px solid var(--line);margin-bottom:6px}
.fbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.fbtn.light.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fbtn.heavy.on{background:var(--warn);border-color:var(--warn);color:var(--accent-ink)}
.fbadge{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:var(--accent-ink)}
.fbadge.light{background:var(--accent)}.fbadge.heavy{background:var(--warn)}
.feelnote{font-size:13px;color:var(--muted);margin-top:8px}
.kgrow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--muted)}
.step{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;display:grid;place-items:center}
.kg{font-family:var(--display);font-size:22px;color:var(--ink);min-width:80px;text-align:center}

.howbtn{margin-top:10px;background:none;border:0;padding:4px 0;font-size:14px;font-weight:600;color:var(--accent);display:inline-flex;gap:6px;align-items:center}
.howbtn .chev{color:var(--accent)}
.howbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.guide{margin-top:8px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:10px;font-size:14px}
.guide h3{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.guide ol,.guide ul{margin:0;padding-left:20px;display:grid;gap:4px}
.guide .avoid li::marker{content:"✕  ";color:var(--warn);font-size:12px}
.guide .knee,.guide .tipx{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.anim-wrap{background:var(--bg);border-radius:10px;padding:8px 10px 10px}
svg.anim{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.an-fig line{stroke:var(--ink);stroke-width:7;stroke-linecap:round}.an-fig circle{fill:var(--ink)}
.an-ghost line{stroke:var(--ink);stroke-width:7;stroke-linecap:round;opacity:.12}.an-ghost circle{fill:var(--ink);opacity:.12}
.an-eq{stroke:var(--muted);stroke-width:3;stroke-linecap:round}.an-bench,.an-eq-f{fill:var(--muted)}
.an-plate,.an-grip{fill:var(--accent)}.an-bar{stroke:var(--accent);stroke-width:4}.an-cable{stroke:var(--muted);stroke-width:2}.an-ghostp{opacity:.15}
.an-cue line{stroke:var(--warn);stroke-width:2}.an-cue path{fill:var(--warn)}.an-cue text{fill:var(--warn);font-size:12px;font-weight:700;font-family:var(--body)}
.an3{stroke:var(--ink);stroke-width:7;stroke-linecap:round}.an3.far{stroke:var(--muted);opacity:.7}.an3h{fill:var(--ink)}
.an3eq{stroke:var(--muted);stroke-width:1.5;opacity:.6}.an3bench{fill:var(--muted);opacity:.5}.an3bar{stroke:var(--accent);stroke-width:4}.an3plate,.an3grip{fill:var(--accent)}
.an3col{stroke:var(--muted);stroke-width:8}.an3eqf{fill:var(--muted)}.an3cable{stroke:var(--muted);stroke-width:2}
.an3db{stroke:var(--muted);stroke-width:3}.an3pad{stroke:var(--muted);stroke-width:9;stroke-linecap:round}.an3fly{fill:var(--muted);opacity:.35}
.an-cap{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;color:var(--muted);margin-top:4px}
.an-cap span:last-child{text-align:right}
.vid{font-weight:600;color:var(--accent);text-decoration:none}
.vid:hover{text-decoration:underline}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.bkrem{display:grid;gap:8px;margin-bottom:14px;border:1.5px solid var(--accent)}.bkrem p{margin:0;font-size:14px}.bkrem small{font-size:13px}

/* programme editor */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.dayhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:14px;text-align:left}
.dayhead .dn{font-family:var(--display);font-size:18px;font-weight:700;width:62px;flex:none;color:var(--muted)}
.dayhead .dt{flex:1;min-width:0;font-weight:600}
.dayhead .dt small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.chev{color:var(--muted);transition:transform .2s}
.open>.dayhead .chev{transform:rotate(90deg)}
.daybody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.sub{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.sub .dayhead{padding:11px 12px}
.sub .daybody{padding:0 12px 12px}

      l.finished = !l.finished; l.finishedAt = l.finished ? new Date().toISOString() : null;
      saveLog(l);
      if (l.finished && !advanceIfWeekDone(S.week)) toast(`${wLabel(k)} marked done.`);
      if (l.finished) badgeAnnounce();
      render(); break;
    }
    case "pcclose": { const v = pcClosed(); v[b.dataset.p] = true; try { localStorage.setItem(PC_KEY, JSON.stringify(v)); } catch {} render(); break; }
    case "bbtry": bbTry(b.dataset.ex); break;
    case "bbnot": { const e = workout(S.week, S.wk).exercises.find(x => x.id === b.dataset.ex), v = bbState(); v[e.name] = { notYet: bbHistory(e.name).length }; bbSave(v); render(); toast("OK – we'll ask again in a couple of sessions."); break; }
    case "bbstay": { const e = workout(S.week, S.wk).exercises.find(x => x.id === b.dataset.ex), v = bbState(); v[e.name] = { stay: true }; bbSave(v); render(); toast("Staying with dumbbells for this programme."); break; }
    case "wdstay": weekDoneClose(false); break;
    case "wdnext": weekDoneClose(true); break;
    case "wdbonus": { const v = jget(BONUS_KEY); v[S.weekDone] = { min: +b.dataset.v, done: false }; jset(BONUS_KEY, v); weekDoneClose(false); toast("Bonus session added – tick it on the minutes card when it's done."); break; }
    case "bonusoff": { const v = jget(BONUS_KEY); v.off = true; jset(BONUS_KEY, v); weekDoneRender(); break; }
    case "bonusdone": { const v = jget(BONUS_KEY); if (v[b.dataset.w]) v[b.dataset.w].done = true; jset(BONUS_KEY, v); render(); break; }
    case "bonusdrop": { const v = jget(BONUS_KEY); if (v[b.dataset.w]) v[b.dataset.w] = { min: 0, done: true, skipped: true }; jset(BONUS_KEY, v); render(); break; }
    case "easymin": { const l = ensureLog(S.week, S.wk); l.sets[b.dataset.ex].forEach(x => { x.reps = +b.dataset.v; x.target = +b.dataset.v; }); saveLog(l); render(); break; }
    case "swopen": S.swap = { ex: b.dataset.ex, reason: null, pick: null, prev: null }; swapRender(); break;
    case "swreason": S.swap.reason = S.swap.reason === b.dataset.v ? null : b.dataset.v; S.swap.pick = null; swapRender(); break;
    case "swpick": S.swap.pick = b.dataset.v; swapRender(); break;
    case "swprev": S.swap.prev = S.swap.prev === b.dataset.v ? null : b.dataset.v; swapRender(); break;
    case "swclose": S.swap = null; swapRender(); break;
    case "swapply": swapApply(b.dataset.v); break;
    case "swundo": swapUndo(b.dataset.ex); break;
    case "tipok": closeTip(false); break;
    case "tipskip": closeTip(true); break;
    case "colour": { const v = b.dataset.v; try { if (v === "plan") localStorage.removeItem(COLOUR_KEY); else localStorage.setItem(COLOUR_KEY, v); } catch {} render(); break; }
    case "bdnext": badgePopNext(); break;
    case "bdskip": { const P = S.badgePop; if (P) { let seen = {}; try { seen = JSON.parse(localStorage.getItem(BADGE_SEEN)) || {}; } catch {} P.list.forEach(b => seen[b.id] = 1); try { localStorage.setItem(BADGE_SEEN, JSON.stringify(seen)); } catch {} S.badgePop = null; badgePopRender(false); } break; }
    case "tipreset": { const v = {}; tipSave(v); toast("Tips will show again as you go."); render(); break; }
    case "cdpause": cdPause(); break;
    case "cddone": cdFinish(false); break;
    case "cdcancel": cdCancel(); break;
    case "tick": {
      if (!S.audio) { try { S.audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
      const l = ensureLog(S.week, S.wk), set = l.sets[b.dataset.ex][+b.dataset.i];
      { const e = workout(S.week, S.wk).exercises.find(x => x.id === b.dataset.ex);   // timed set or cardio block: countdown instead of a plain tick
        if (e && !set.done && (e.unit === "sec" || e.unit === "min")) { if (S.cd && S.cd.ex === e.id && S.cd.i === +b.dataset.i) cdPause(); else { if (S.cd) cdCancel(); cdStart(e, +b.dataset.i); } break; } }
      { const te = workout(S.week, S.wk).exercises.find(x => x.id === b.dataset.ex), j = +b.dataset.i;
        if (set.done && te && l.setFeel?.[te.id]?.[j]) { delete l.setFeel[te.id][j]; set.done = false; const st = findState(l, te); set.done = true;
          if (st.next != null) l.sets[te.id].forEach((x, i) => { if (i > j && !x.done) x.kg = st.next; }); } }   // unticking removes that set's mark
      set.done = !set.done;
      if (set.done) { const te = workout(S.week, S.wk).exercises.find(x => x.id === b.dataset.ex); if (te && isFinding(te, S.week, l.id)) { l.finding = l.finding || {}; l.finding[te.id] = true; } }
      if (l.finished && !set.done) l.finished = false;
      if (!l.date || !stats(l).done) l.date = today();
      saveLog(l);
      const e = workout(S.week, S.wk).exercises.find(x => x.id === b.dataset.ex);
      if (set.done) { if (e?.rest) startTimer(e.rest, e.name); keepAwake(); }
      render(); break;
    }
    case "reps": {
      const l = ensureLog(S.week, S.wk), set = l.sets[b.dataset.ex][+b.dataset.i];
      const e = workout(S.week, S.wk).exercises.find(x => x.id === b.dataset.ex), step = (e?.unit || "reps") === "reps" ? 1 : 5;
      set.reps = Math.max(0, Math.min(999, set.reps + step * +b.dataset.d));
      saveLog(l); render(); break;
    }
    case "feel": {
      const l = ensureLog(S.week, S.wk), fe = workout(S.week, S.wk).exercises.find(x => x.id === b.dataset.ex);
      if (fe && isFinding(fe, S.week, l.id)) {
        const arr = l.sets[fe.id], j = arr.map(x => x.done).lastIndexOf(true);
        if (j < 0) { toast("Tick a set first, then mark how it felt."); break; }
        const f = setFeelApply(l, fe, j, b.dataset.f), nx = arr.find((x, i) => i > j && !x.done);
        saveLog(l); render();
        const fs = findState(l, fe);
        if (nx && fs.found != null) toast(`Found: ${fmt(fs.found)} kg – between too easy and too heavy.`);
        else if (nx) toast(f === "light" ? `Felt light – next set ${fmt(nx.kg)} kg.` : f === "heavy" ? `Felt heavy – next set ${fmt(nx.kg)} kg.` : `No mark – next set stays at ${fmt(nx.kg)} kg.`);
        else toast(f ? "Noted – this weight is your starting point next time." : "Mark removed.");
        break;
      }
      l.feel = l.feel || {};
      l.feel[b.dataset.ex] = l.feel[b.dataset.ex] === b.dataset.f ? null : b.dataset.f;
      saveLog(l); render(); break;
    }
    case "kg": {
      const l = ensureLog(S.week, S.wk), arr = l.sets[b.dataset.ex], d = +b.dataset.d;
      const ex = workout(S.week, S.wk).exercises.find(x => x.id === b.dataset.ex) || {};
      const left = arr.filter(x => !x.done); const lo = +(b.dataset.min || 0); (left.length ? left : arr).forEach(x => x.kg = Math.max(lo, Math.round(((x.kg || 0) + d * stepOf(ex, x.kg || 0, d)) * 100) / 100));
      saveLog(l); render(); break;
    }
    case "finish": { const l = S.logs[logId(S.week, S.wk)]; if (l) { l.finished = true; l.finishedAt = new Date().toISOString(); saveLog(l); S.timer = null; clearInterval(tick); badgeAnnounce();
      if (!advanceIfWeekDone(S.week)) { const nk = REQ.find(k => !isDone(S.week, k)); toast(nk ? "Workout saved. Next up: " + wLabel(nk) + "." : "Workout saved."); }
      render(); } break; }
    case "libopen": { const id = b.dataset.c; S.libOpen = S.libOpen === id ? null : id; render(); if (S.libOpen) document.querySelector(".libitem.open")?.scrollIntoView({ block: "nearest" }); break; }
    case "libpick": { S.libPick[b.dataset.c] = +b.dataset.j; render(); break; }
    case "guide": { const id = b.dataset.ex; S.guides.has(id) ? S.guides.delete(id) : S.guides.add(id); render(); break; }
    case "reopen": { const l = S.logs[logId(S.week, S.wk)]; if (l) { l.finished = false; saveLog(l); render(); } break; }
    case "t15": if (S.timer) { S.timer.end += 15000; S.timer.total += 15; S.timer.beeped = false; S.timer.warned = (S.timer.end - Date.now()) / 1000 <= 10; renderTimer(); } break;
    case "tstop": S.timer = null; clearInterval(tick); renderTimer(); break;
    case "toggle": S.open = S.open === b.dataset.key ? null : b.dataset.key; S.openW = null; render(); break;
    case "togglew": S.openW = S.openW === b.dataset.key ? null : b.dataset.key; render(); break;
    case "add": { const wo = S.program.phases[+b.dataset.p].workouts[b.dataset.k];
      const e = { id: "x" + uid(), name: "New exercise", sets: 3, reps: 10, kg: 0, rest: 90, inc: 2.5, unit: "reps" };
      wo.exercises.push(e); saveProgram(); render(); const el = document.getElementById("en-" + e.id); if (el) { el.focus(); el.select(); } break; }
    case "del": {
      const id = b.dataset.ex; if (S.confirmDel !== id) { S.confirmDel = id; render(); break; }
      S.confirmDel = null; const wo = S.program.phases[+b.dataset.p].workouts[b.dataset.k]; wo.exercises = wo.exercises.filter(e => e.id !== id); saveProgram(); render(); break; }
    case "up": { const ex = S.program.phases[+b.dataset.p].workouts[b.dataset.k].exercises, i = ex.findIndex(e => e.id === b.dataset.ex);
      if (i > 0) { [ex[i - 1], ex[i]] = [ex[i], ex[i - 1]]; saveProgram(); render(); } break; }
    case "metric": S.metric = b.dataset.m; render(); break;
    case "bkdl": doDownload(); break;
    case "backup": doBackup(); break;
    case "bkdemo": S.bkDemo = true; S.tab = "today"; window.scrollTo(0, 0); render(); break;
    case "bklater": { S.bkDemo = false; const d = new Date(); d.setDate(d.getDate() + 3); try { localStorage.setItem("tw.backupSnooze", isoDate(d)); } catch {} render(); break; }
    case "bdel": { const id = b.dataset.id; if (S.confirmB !== id) { S.confirmB = id; render(); break; }
      S.confirmB = null; delete S.body[id]; removeDoc("body/" + id); render(); break; }
  }
});
document.addEventListener("submit", ev => {
  if (ev.target.id !== "bodyform") return;
  ev.preventDefault();
  const date = document.getElementById("b-date").value || today();
  const entry = Object.assign({}, S.body[date] || {}, { date });
  let n = 0;
  METRICS.forEach(m => { const raw = document.getElementById("b-" + m.k).value.replace(",", "."); const v = parseFloat(raw); if (!isNaN(v) && v > 0) { entry[m.k] = v; n++; } });
  if (!n) { toast("Enter at least one measurement."); return; }
  S.body[date] = entry; persist("body/" + date, clone(entry));
  toast(`Saved ${n} measurement${n > 1 ? "s" : ""} for ${shortDate(date)}.`);
  render();
});
document.addEventListener("input", ev => {
  if (obInput(ev.target)) return;
  if (ev.target.id === "libq") { S.libQ = ev.target.value; const r = document.getElementById("libres"); if (r) r.innerHTML = libResults(); return; }   // no full redraw: keeps the keyboard up
  const t = ev.target, f = t.dataset.field; if (!f) return;
  const wo = S.program.phases[+t.dataset.p].workouts[t.dataset.k];
  if (f === "wname") wo.name = t.value;
  else {
    const e = wo.exercises.find(x => x.id === t.dataset.ex); if (!e) return;
    if (f === "name") e.name = t.value;
    else { const v = parseFloat(String(t.value).replace(",", ".")); if (isNaN(v)) return; e[f] = f === "kg" ? Math.max(e.bw ? -80 : 0, v) : Math.max(f === "rest" ? 0 : 1, Math.round(v)); }
  }
  saveProgram(true);
});
window.addEventListener("resize", () => { if (S.tab === "body") wireChart(); });

function backupCard() {
  let last = null; try { last = localStorage.getItem("tw.lastBackup"); } catch {}
  return `<h2 class="sec">Backup</h2><div class="card" style="display:grid;gap:10px">
    <div class="muted" style="font-size:14px">Everything is stored on this phone. Save a backup now and then, and after big changes, so nothing is lost if the phone is reset or replaced.${last ? ` Last backup: ${shortDate(last)}.` : " No backup saved yet."}</div>
    <div class="row"><button class="btn" data-act="backup" id="b-backup">Save backup</button>
    <label class="btn ghost" for="b-restore" style="cursor:pointer">Restore from file</label>
    <input type="file" id="b-restore" accept="application/json,.json,text/plain,.txt" hidden></div>
    
    <button type="button" class="linkbtn" data-act="bkdl">Download instead</button>
    <small class="muted">“Save backup” opens your phone's share menu – pick Google Drive and a folder like “Backup Training Week” (Drive remembers it next time), or Files or email. Keep it off the phone, so it survives if the phone is lost.</small></div>`;
}
// Backup (Christian 2026-11-09): a web app can't pick a folder, so "Save backup" opens the phone's share menu with the file –
// Google Drive (a "Backup Training Week" folder, remembered next time), Files or email. "Download instead" keeps the old way.
function backupFile() {
  const data = { app: "training-week", version: 1, savedAt: new Date().toISOString(), program: S.program, logs: S.logs, body: S.body };
  // .txt / text/plain: Android's share menu only takes some file types from web apps, and .json isn't one of them (the content is still JSON)
  return new File([JSON.stringify(data)], `Training Week backup ${today()}.txt`, { type: "text/plain" });
}
function backupSaved(msg) {
  try { localStorage.setItem("tw.lastBackup", today()); localStorage.removeItem("tw.backupSnooze"); localStorage.setItem("tw.backupCount", String((+localStorage.getItem("tw.backupCount") || 0) + 1)); } catch {}
  S.bkDemo = false; toast(msg); render(); setTimeout(badgeAnnounce, 300);
}
function doDownload(why) {
  const f = backupFile(), a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  backupSaved(why ? `Saved to Downloads (${why}).` : "Backup saved to your Downloads folder.");
}
async function doBackup() {
  const f = backupFile();
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], title: f.name, text: "Training Week backup – save it in a \"Backup Training Week\" folder in Google Drive." }); backupSaved("Backup shared."); }
    catch (e) { if (e && e.name !== "AbortError") doDownload("sharing failed: " + (e.name || "error")); }      // cancelled = nothing saved; anything else → download instead
    return;
  }
  doDownload(!navigator.share ? "this browser can't share" : !navigator.canShare ? "this browser can't share files" : "the share menu won't take this file");
}
document.addEventListener("change", ev => {
  if (!["b-restore", "ob-restore"].includes(ev.target.id) || !ev.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== "training-week" || !d.program) throw new Error("wrong file");
      S.program = d.program; S.logs = d.logs || {}; S.body = d.body || {}; migrate(); syncKeys(); saveLocal();
      // a restored programme counts as set up (no setup questions); someone moving their data already knows the app → tips off ("Show tips again" on Programme)
      if (!loadProfile()) { saveProfile({ skipped: true, restored: today() }); try { localStorage.setItem("tw.tips", JSON.stringify({ skipAll: true })); } catch {} }
      S.ob = null; S.tab = "today"; S.week = null; toast("Backup restored."); render(); setTimeout(badgeAnnounce, 800);
    } catch { toast("That file isn't a Training Week backup."); }
  };
  r.readAsText(ev.target.files[0]);
});

render();
connect();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
window.addEventListener('online', render); window.addEventListener('offline', render);
})();
</script>
