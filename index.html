<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1115" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Training Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app shell — header, scrolling content, rest timer + tab bar pinned to the bottom. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e4e8ed; --ink:#14181d; --muted:#5b6672; --line:#d4dae2;
  --accent:#1f5bd8; --accent-ink:#ffffff; --accent-soft:#dfe8fb;
  --done:#1d7f47; --done-bg:#e1f2e8; --warn:#b4410f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1115; --surface:#171c22; --sunk:#11151a; --ink:#e7ecf1; --muted:#8e9aa8; --line:#28303a;
  --accent:#6693ff; --accent-ink:#0a1020; --accent-soft:#1c2a4a;
  --done:#43cf7f; --done-bg:#15291e; --warn:#ff8a4c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#171c22; --sunk:#11151a; --ink:#e7ecf1; --muted:#8e9aa8; --line:#28303a;
  --accent:#6693ff; --accent-ink:#0a1020; --accent-soft:#1c2a4a;
  --done:#43cf7f; --done-bg:#15291e; --warn:#ff8a4c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding:0 16px;padding-block:0 180px;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

header.top{padding-block:18px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;line-height:1.1}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sec{margin:24px 0 10px}

/* week card */
.weekcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.weeknav{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}
.weeknav .wt{font-family:var(--display);font-size:20px;font-weight:700}
.weeknav .wt small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.navbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;display:grid;place-items:center}
.navbtn:disabled{opacity:.35;cursor:default}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow.sel{background:var(--accent-soft)}
.check{width:30px;height:30px;flex:none;border-radius:9px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;color:transparent;font-weight:700}
.check.on{background:var(--done);border-color:var(--done);color:var(--accent-ink)}
.wbtn{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0}
.wbtn b{display:block;font-weight:600}
.wbtn small{display:block;font-size:13px;color:var(--muted)}
.wrow .go{color:var(--muted)}

/* session */
.sess{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.meter{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-bottom:14px}
.meter span{display:block;height:100%;background:var(--done);transition:width .25s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--done-bg);color:var(--done)}
.note{font-size:14px;color:var(--ink);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:14px}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ex.complete{border-color:var(--done)}
.ex.ss1{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.ex.ss2{border-top-left-radius:0;border-top-right-radius:0;border-top-style:dashed}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exname{font-weight:600;font-size:17px;min-width:0}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.target{font-family:var(--display);font-size:20px;font-weight:600;white-space:nowrap}
.cue{font-size:13px;color:var(--muted);margin-top:2px}
.last{font-size:13px;color:var(--muted);margin-top:2px}
.last .up{color:var(--done);font-weight:600}
.exbody{display:flex;gap:10px;align-items:flex-end;margin-top:12px}
.setcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lastlbl{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lastlbl .up{color:var(--done);text-transform:none;letter-spacing:0;font-size:13px;margin-left:auto}
.lastrow,.sets{display:grid;gap:8px}
.lastrow{font-size:13px;color:var(--muted);text-align:center}
.setbox{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.setbox.done{border:2px solid var(--done)}
.arr{height:26px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.arr.up{border-bottom:1px solid var(--line)}
.arr.dn{border-top:1px solid var(--line)}
.setbox.done .arr{border-color:color-mix(in srgb,var(--done) 35%,transparent)}
.setmain{min-height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1;padding:0}
.setmain .rp{display:flex;align-items:baseline;gap:1px}
.setmain b{font-family:var(--display);font-size:24px}
.setmain .of{font-family:var(--display);font-size:15px;opacity:.75}
.setmain small{font-size:11px;color:var(--muted)}
.setbox.done .setmain{background:var(--done);color:var(--accent-ink)}
.setbox.done .setmain small{color:var(--accent-ink);opacity:.85}
.feel{display:flex;flex-direction:column;gap:10px;padding-left:10px;border-left:1px solid var(--line);margin-bottom:6px}
.fbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:0}
.fbtn.light.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fbtn.heavy.on{background:var(--warn);border-color:var(--warn);color:var(--accent-ink)}
.fbadge{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:var(--accent-ink)}
.fbadge.light{background:var(--accent)}.fbadge.heavy{background:var(--warn)}
.feelnote{font-size:13px;color:var(--muted);margin-top:8px}
.kgrow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--muted)}
.step{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;display:grid;place-items:center}
.kg{font-family:var(--display);font-size:22px;color:var(--ink);min-width:80px;text-align:center}

.howbtn{margin-top:10px;background:none;border:0;padding:4px 0;font-size:14px;font-weight:600;color:var(--accent);display:inline-flex;gap:6px;align-items:center}
.howbtn .chev{color:var(--accent)}
.howbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.guide{margin-top:8px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:10px;font-size:14px}
.guide h3{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.guide ol,.guide ul{margin:0;padding-left:20px;display:grid;gap:4px}
.guide .avoid li::marker{content:"✕  ";color:var(--warn);font-size:12px}
.guide .knee,.guide .tipx{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.anim-wrap{background:var(--bg);border-radius:10px;padding:8px 10px 10px}
svg.anim{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.an-fig line{stroke:var(--ink);stroke-width:7;stroke-linecap:round}.an-fig circle{fill:var(--ink)}
.an-ghost line{stroke:var(--ink);stroke-width:7;stroke-linecap:round;opacity:.12}.an-ghost circle{fill:var(--ink);opacity:.12}
.an-eq{stroke:var(--muted);stroke-width:3;stroke-linecap:round}.an-bench,.an-eq-f{fill:var(--muted)}
.an-plate,.an-grip{fill:var(--accent)}.an-bar{stroke:var(--accent);stroke-width:4}.an-cable{stroke:var(--muted);stroke-width:2}.an-ghostp{opacity:.15}
.an-cue line{stroke:var(--warn);stroke-width:2}.an-cue path{fill:var(--warn)}.an-cue text{fill:var(--warn);font-size:12px;font-weight:700;font-family:var(--body)}
.an3{stroke:var(--ink);stroke-width:7;stroke-linecap:round}.an3.far{stroke:var(--muted);opacity:.7}.an3h{fill:var(--ink)}
.an3eq{stroke:var(--muted);stroke-width:1.5;opacity:.6}.an3bench{fill:var(--muted);opacity:.5}.an3bar{stroke:var(--accent);stroke-width:4}.an3plate,.an3grip{fill:var(--accent)}
.an3col{stroke:var(--muted);stroke-width:8}.an3eqf{fill:var(--muted)}.an3cable{stroke:var(--muted);stroke-width:2}
.an3db{stroke:var(--muted);stroke-width:3}.an3pad{stroke:var(--muted);stroke-width:9;stroke-linecap:round}.an3fly{fill:var(--muted);opacity:.35}
.an-cap{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;color:var(--muted);margin-top:4px}
.an-cap span:last-child{text-align:right}
.vid{font-weight:600;color:var(--accent);text-decoration:none}
.vid:hover{text-decoration:underline}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* programme editor */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.dayhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:14px;text-align:left}
.dayhead .dn{font-family:var(--display);font-size:18px;font-weight:700;width:62px;flex:none;color:var(--muted)}
.dayhead .dt{flex:1;min-width:0;font-weight:600}
.dayhead .dt small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.chev{color:var(--muted);transition:transform .2s}
.open>.dayhead .chev{transform:rotate(90deg)}
.daybody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.sub{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.sub .dayhead{padding:11px 12px}
.sub .daybody{padding:0 12px 12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:500}
input[type=number]{font-variant-numeric:tabular-nums}
.exedit{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.exactions{display:flex;gap:6px;justify-content:flex-end}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.iconbtn.del{color:var(--warn)}

/* body */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.1}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .lbl{fill:var(--ink);font-size:13px;font-weight:600;font-family:var(--body)}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;transform:translate(-50%,-110%);background:var(--ink);color:var(--bg);font-size:13px;padding:5px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700}
.stat .d{font-size:13px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.form .full{grid-column:1/-1}
details.tips{font-size:14px;color:var(--muted);margin-top:10px}
details.tips summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.tips ul{padding-left:18px;margin:8px 0 0}

/* progress */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.hist .d{font-size:13px;color:var(--muted)}
.hist .t{font-weight:600}
.hist .v{text-align:right;font-family:var(--display);font-size:20px;white-space:nowrap}
.hist .v small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.grid12{display:grid;grid-template-columns:auto repeat(4,1fr);gap:4px 6px;align-items:center;font-size:13px}
.grid12 .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.grid12 .wk{color:var(--muted);font-variant-numeric:tabular-nums;padding-right:4px}
.grid12 .c{height:20px;border-radius:5px;background:var(--sunk)}
.grid12 .c.on{background:var(--done)}
.grid12 .c.opt.on{background:var(--accent)}
.grid12 .ph{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--muted);margin-top:6px}

/* bottom chrome */
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.timer{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.timer .clock{font-family:var(--display);font-size:32px;font-weight:700;min-width:74px}
.timer .clock.over{color:var(--done)}
.timer .lbl{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.timer .bar{height:4px;background:var(--sunk);border-radius:4px;margin-top:4px;overflow:hidden}
.timer .bar span{display:block;height:100%;background:var(--accent)}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>html,body{margin:0}[hidden]{display:none!important}header.top{padding-top:calc(18px + env(safe-area-inset-top,0px))}</style>
</head>
<body>


<div class="wrap" id="app"></div>
<div class="bottom">
  <div class="timer" id="timer" hidden></div>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-tab="today" id="tab-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h2M19 12h2M6 8v8M18 8v8M9 6v12M15 6v12M9 12h6"/></svg>Workout</button>
    <button class="tab" data-tab="plan" id="tab-plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Programme</button>
    <button class="tab" data-tab="body" id="tab-body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16v10H4z"/><path d="M8 7v3M12 7v4M16 7v3"/></svg>Body</button>
    <button class="tab" data-tab="history" id="tab-history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Progress</button>
  </nav>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const GUIDES = {
  "barbell bench press": {
    steps: ["Lie with eyes under the bar, feet flat on the floor.", "Pull shoulder blades back and down, keep a small arch in the upper back.", "Grip slightly wider than shoulders, wrists stacked over elbows.", "Lower the bar under control to the lower chest, elbows about 45° from the body.", "Press up and slightly back toward the rack until arms are straight."],
    avoid: ["Flaring elbows straight out to the sides (hard on the shoulders).", "Bouncing the bar off the chest.", "Lifting hips off the bench or feet off the floor.", "Bending wrists backwards. Keep them straight over the forearm."],
    tip: "Use safety arms or a spotter when sets get heavy."
  },
  "barbell overhead press": {
    steps: ["Bar on the front of the shoulders, grip just outside shoulder width.", "Feet hip-width, squeeze glutes and brace the stomach.", "Move the head slightly back and press the bar straight up.", "Once the bar passes the forehead, move the head forward under it.", "Finish with arms locked, bar over the middle of the feet."],
    avoid: ["Leaning back to push the weight up. That loads the lower back.", "Pressing the bar out in front of you instead of straight up.", "Using the legs to bounce it (that's a push press)."]
  },
  "incline dumbbell press": {
    steps: ["Bench at 30–45°. Sit with dumbbells on your thighs, then lie back and bring them up.", "Shoulder blades back and down, feet planted.", "Lower the dumbbells to the sides of the upper chest, elbows about 45° from the body.", "Press up and slightly in until arms are straight over the shoulders."],
    avoid: ["A bench angle so steep it turns into a shoulder press.", "Letting the dumbbells drift far apart at the bottom.", "Dropping the dumbbells to the sides when finishing. Bring them back to the thighs."]
  },

  const lastP = xy[xy.length - 1];
  const xl = `<text class="axis" x="${L}" y="${H - 6}">${shortDate(pts[0].d)}</text><text class="axis" x="${W - R}" y="${H - 6}" text-anchor="end">${shortDate(pts[pts.length - 1].d)}</text>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.n} over time">${g}<path class="ar" d="${area}"/><path class="ln" d="${line}"/>
    ${xy.map(p => `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join("")}
    <circle class="pt" cx="${lastP[0]}" cy="${lastP[1]}" r="6"/><text class="lbl" x="${lastP[0] + 9}" y="${lastP[1] + 4}">${fmt(pts[pts.length - 1].v)}</text>${xl}
    ${xy.map((p, i) => `<circle class="hit" cx="${p[0]}" cy="${p[1]}" r="16" data-i="${i}"/>`).join("")}</svg><div class="tip" hidden></div>`;
  const tip = box.querySelector(".tip");
  const show = i => { const p = xy[i]; tip.textContent = `${shortDate(pts[i].d)}: ${fmt(pts[i].v)} ${m.u}`; tip.style.left = (p[0] / W * 100) + "%"; tip.style.top = (p[1] / H * box.querySelector("svg").getBoundingClientRect().height) + "px"; tip.hidden = false; };
  box.querySelectorAll(".hit").forEach(c => { c.addEventListener("pointerenter", () => show(+c.dataset.i)); c.addEventListener("click", () => show(+c.dataset.i)); c.addEventListener("pointerleave", () => tip.hidden = true); });
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

function historyView() { return historyInner() + backupCard(); }
function historyInner() {
  let h = head("12-week overview", "Progress");
  const P = S.program;
  h += `<div class="card"><div class="grid12"><span></span><span class="h">W1</span><span class="h">W2</span><span class="h">W3</span><span class="h">Extra</span>`;
  P.phases.forEach((ph, pi) => {
    h += `<span class="ph">Phase ${pi + 1} · ${esc(ph.name)}</span>`;
    ph.weeks.forEach(w => { h += `<span class="wk">Week ${w}</span>` + WK.map(k => `<span class="c ${k === "c" ? "opt" : ""} ${isDone(w, k) ? "on" : ""}" title="Week ${w} ${wLabel(k)}${isDone(w, k) ? " done" : ""}"></span>`).join(""); });
  });
  h += `</div></div>`;
  const all = Object.values(S.logs).filter(l => stats(l).done > 0).sort((a, b) => b.id.localeCompare(a.id));
  if (!all.length) return h + `<p class="empty">Logged sets show up here. Tick a set on the Workout tab to start.</p>`;
  const best = {};
  all.forEach(l => Object.entries(l.sets || {}).forEach(([id, arr]) => {
    const n = l.names?.[id] || "Exercise", k = n.toLowerCase();
    arr.filter(x => x.done && x.kg > 0).forEach(x => { if (!best[k] || x.kg > best[k].kg || (x.kg === best[k].kg && x.reps > best[k].reps)) best[k] = { name: n, kg: x.kg, reps: x.reps, week: l.week }; });
  }));
  const rows = Object.values(best).sort((a, b) => a.name.localeCompare(b.name));
  if (rows.length) h += `<h2 class="sec">Heaviest sets</h2><div class="tbl"><table><thead><tr><th>Exercise</th><th class="n">Best</th><th class="n">Week</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${esc(r.name)}</td><td class="n">${fmt(r.kg)} kg × ${r.reps}</td><td class="n">${r.week}</td></tr>`).join("") + `</tbody></table></div>`;
  h += `<h2 class="sec">Sessions</h2>`;
  all.forEach(l => { const st = stats(l);
    h += `<div class="hist"><div><div class="d">Week ${l.week} · ${wLabel(l.workout)} · ${shortDate(l.date)}${l.finished ? "" : " · not finished"}</div><div class="t">${esc(l.title)}</div></div><div class="v num">${fmt(st.vol)} kg<small>${st.done}/${st.total} sets</small></div></div>`; });
  return h;
}

// ---- rest timer
let tick = null;
const timerEl = document.getElementById("timer");
function startTimer(sec, label) {
  if (!sec) return;
  S.timer = { end: Date.now() + sec * 1000, total: sec, label, beeped: false };
  clearInterval(tick); tick = setInterval(renderTimer, 250); renderTimer();
}
function renderTimer() {
  const t = S.timer;
  if (!t) { timerEl.hidden = true; return; }
  const left = Math.round((t.end - Date.now()) / 1000);
  if (left <= 0 && !t.beeped) { t.beeped = true; beep(); try { navigator.vibrate?.([200, 100, 200]); } catch {} }
  const a = Math.abs(left), mm = Math.floor(a / 60), ss = String(a % 60).padStart(2, "0");
  const pct = Math.max(0, Math.min(100, (1 - left / t.total) * 100));
  timerEl.hidden = false;
  timerEl.innerHTML = `<div class="clock num ${left <= 0 ? "over" : ""}">${left < 0 ? "+" : ""}${mm}:${ss}</div>
    <div class="lbl">${left <= 0 ? "Rest over. Next set!" : "Resting after " + esc(t.label)}<div class="bar"><span style="width:${pct}%"></span></div></div>
    <button class="btn ghost small" data-act="t15">+15 s</button><button class="btn small" data-act="tstop">${left <= 0 ? "Done" : "Skip"}</button>`;
}
function beep() {
  const ctx = S.audio; if (!ctx) return;
  try { [0, .25, .5].forEach(o => { const osc = ctx.createOscillator(), g = ctx.createGain(); osc.frequency.value = 880;
    g.gain.setValueAtTime(.0001, ctx.currentTime + o); g.gain.exponentialRampToValueAtTime(.3, ctx.currentTime + o + .02); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + o + .18);
    osc.connect(g).connect(ctx.destination); osc.start(ctx.currentTime + o); osc.stop(ctx.currentTime + o + .2); }); } catch {}
}
let wake = null;
async function keepAwake() { try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.timer) keepAwake(); });

let toastT;
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

// ---- events
function findEx(pi, k, id) { return S.program.phases[pi].workouts[k].exercises.find(e => e.id === id); }
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act],[data-tab]"); if (!b) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; try { localStorage.setItem("tw.tab", S.tab); } catch {} window.scrollTo(0, 0); render(); return; }
  const a = b.dataset.act;
  if (a !== "del") S.confirmDel = null;
  if (a !== "bdel") S.confirmB = null;
  switch (a) {
    case "wprev": if (S.week > 1) { S.week--; S.wk = nextWorkout(S.week); render(); } break;
    case "wnext": if (S.week < totalWeeks()) { S.week++; S.wk = nextWorkout(S.week); render(); } break;
    case "pickw": S.wk = b.dataset.k; render(); break;
    case "check": {
      const k = b.dataset.k, l = ensureLog(S.week, k);
      l.finished = !l.finished; l.finishedAt = l.finished ? new Date().toISOString() : null;
      saveLog(l);
      if (l.finished && !advanceIfWeekDone(S.week)) toast(`${wLabel(k)} marked done.`);
      render(); break;
    }
    case "tick": {
      if (!S.audio) { try { S.audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
      const l = ensureLog(S.week, S.wk), set = l.sets[b.dataset.ex][+b.dataset.i];
      set.done = !set.done;
      if (l.finished && !set.done) l.finished = false;
      if (!l.date || !stats(l).done) l.date = today();
      saveLog(l);
      const e = workout(S.week, S.wk).exercises.find(x => x.id === b.dataset.ex);
      if (set.done) { if (e?.rest) startTimer(e.rest, e.name); keepAwake(); }
      render(); break;
    }
    case "reps": {
      const l = ensureLog(S.week, S.wk), set = l.sets[b.dataset.ex][+b.dataset.i];
      const e = workout(S.week, S.wk).exercises.find(x => x.id === b.dataset.ex), step = (e?.unit || "reps") === "reps" ? 1 : 5;
      set.reps = Math.max(0, Math.min(999, set.reps + step * +b.dataset.d));
      saveLog(l); render(); break;
    }
    case "feel": {
      const l = ensureLog(S.week, S.wk); l.feel = l.feel || {};
      l.feel[b.dataset.ex] = l.feel[b.dataset.ex] === b.dataset.f ? null : b.dataset.f;
      saveLog(l); render(); break;
    }
    case "kg": {
      const l = ensureLog(S.week, S.wk), arr = l.sets[b.dataset.ex], d = +b.dataset.d;
      const left = arr.filter(x => !x.done); (left.length ? left : arr).forEach(x => x.kg = Math.max(0, Math.round(((x.kg || 0) + d) * 100) / 100));
      saveLog(l); render(); break;
    }
    case "finish": { const l = S.logs[logId(S.week, S.wk)]; if (l) { l.finished = true; l.finishedAt = new Date().toISOString(); saveLog(l); S.timer = null; clearInterval(tick);
      if (!advanceIfWeekDone(S.week)) { const nk = REQ.find(k => !isDone(S.week, k)); toast(nk ? "Workout saved. Next up: " + wLabel(nk) + "." : "Workout saved."); }
      render(); } break; }
    case "guide": { const id = b.dataset.ex; S.guides.has(id) ? S.guides.delete(id) : S.guides.add(id); render(); break; }
    case "reopen": { const l = S.logs[logId(S.week, S.wk)]; if (l) { l.finished = false; saveLog(l); render(); } break; }
    case "t15": if (S.timer) { S.timer.end += 15000; S.timer.total += 15; S.timer.beeped = false; renderTimer(); } break;
    case "tstop": S.timer = null; clearInterval(tick); renderTimer(); break;
    case "toggle": S.open = S.open === b.dataset.key ? null : b.dataset.key; S.openW = null; render(); break;
    case "togglew": S.openW = S.openW === b.dataset.key ? null : b.dataset.key; render(); break;
    case "add": { const wo = S.program.phases[+b.dataset.p].workouts[b.dataset.k];
      const e = { id: "x" + uid(), name: "New exercise", sets: 3, reps: 10, kg: 0, rest: 90, inc: 2.5, unit: "reps" };
      wo.exercises.push(e); saveProgram(); render(); const el = document.getElementById("en-" + e.id); if (el) { el.focus(); el.select(); } break; }
    case "del": {
      const id = b.dataset.ex; if (S.confirmDel !== id) { S.confirmDel = id; render(); break; }
      S.confirmDel = null; const wo = S.program.phases[+b.dataset.p].workouts[b.dataset.k]; wo.exercises = wo.exercises.filter(e => e.id !== id); saveProgram(); render(); break; }
    case "up": { const ex = S.program.phases[+b.dataset.p].workouts[b.dataset.k].exercises, i = ex.findIndex(e => e.id === b.dataset.ex);
      if (i > 0) { [ex[i - 1], ex[i]] = [ex[i], ex[i - 1]]; saveProgram(); render(); } break; }
    case "metric": S.metric = b.dataset.m; render(); break;
    case "backup": doBackup(); break;
    case "bdel": { const id = b.dataset.id; if (S.confirmB !== id) { S.confirmB = id; render(); break; }
      S.confirmB = null; delete S.body[id]; removeDoc("body/" + id); render(); break; }
  }
});
document.addEventListener("submit", ev => {
  if (ev.target.id !== "bodyform") return;
  ev.preventDefault();
  const date = document.getElementById("b-date").value || today();
  const entry = Object.assign({}, S.body[date] || {}, { date });
  let n = 0;
  METRICS.forEach(m => { const raw = document.getElementById("b-" + m.k).value.replace(",", "."); const v = parseFloat(raw); if (!isNaN(v) && v > 0) { entry[m.k] = v; n++; } });
  if (!n) { toast("Enter at least one measurement."); return; }
  S.body[date] = entry; persist("body/" + date, clone(entry));
  toast(`Saved ${n} measurement${n > 1 ? "s" : ""} for ${shortDate(date)}.`);
  render();
});
document.addEventListener("input", ev => {
  const t = ev.target, f = t.dataset.field; if (!f) return;
  const wo = S.program.phases[+t.dataset.p].workouts[t.dataset.k];
  if (f === "wname") wo.name = t.value;
  else {
    const e = wo.exercises.find(x => x.id === t.dataset.ex); if (!e) return;
    if (f === "name") e.name = t.value;
    else { const v = parseFloat(String(t.value).replace(",", ".")); if (isNaN(v)) return; e[f] = f === "kg" ? Math.max(0, v) : Math.max(f === "rest" ? 0 : 1, Math.round(v)); }
  }
  saveProgram(true);
});
window.addEventListener("resize", () => { if (S.tab === "body") wireChart(); });

function backupCard() {
  let last = null; try { last = localStorage.getItem("tw.lastBackup"); } catch {}
  return `<h2 class="sec">Backup</h2><div class="card" style="display:grid;gap:10px">
    <div class="muted" style="font-size:14px">Everything is stored on this phone. Save a backup now and then, and after big changes, so nothing is lost if the phone is reset or replaced.${last ? ` Last backup: ${shortDate(last)}.` : " No backup saved yet."}</div>
    <div class="row"><button class="btn" data-act="backup" id="b-backup">Save backup file</button>
    <label class="btn ghost" for="b-restore" style="cursor:pointer">Restore from file</label>
    <input type="file" id="b-restore" accept="application/json,.json" hidden></div></div>`;
}
function doBackup() {
  const data = { app: "training-week", version: 1, savedAt: new Date().toISOString(), program: S.program, logs: S.logs, body: S.body };
  const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `training-week-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  try { localStorage.setItem("tw.lastBackup", today()); } catch {}
  toast("Backup saved to your Downloads folder."); render();
}
document.addEventListener("change", ev => {
  if (ev.target.id !== "b-restore" || !ev.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== "training-week" || !d.program) throw new Error("wrong file");
      S.program = d.program; S.logs = d.logs || {}; S.body = d.body || {}; saveLocal();
      S.week = null; toast("Backup restored."); render();
    } catch { toast("That file isn't a Training Week backup."); }
  };
  r.readAsText(ev.target.files[0]);
});

render();
connect();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
window.addEventListener('online', render); window.addEventListener('offline', render);
})();
</script>
